title: "LOG"
author: "Thiago Barreto Sobral Nunes"
tooltip: |
  Pendências, interferências e passes da obra — com lugar no modelo.

  • LOG DO PROJETO: selecione elementos (inclusive dentro de
    vínculo), tire um print e deixe um recado para alguém ou para
    você. Fica em DAT\LOG, na pasta da obra: todo mundo vê, sem
    planilha e sem internet. O que chegou para você aparece marcado.
  • INTERFERÊNCIAS: cruze vários modelos vinculados de uma vez
    (ex.: Tubulação × Dutos) — o Revit faz um por vez. Também abre
    o HTML exportado pelo Revit.
  • Comentar numa interferência cria o apontamento no LOG, com
    destinatário e print. Os dois são espelho: resolver ou
    responder de um lado muda o outro.
  • PASSES DE LAJE: passe × tubo, laje por laje, ou a lista de
    todos os passes para percorrer.
  • "Na vista" e "3D" levam até o elemento, no modelo aberto ou no
    vínculo. Modeless: fica aberta enquanto você corrige o modelo.
