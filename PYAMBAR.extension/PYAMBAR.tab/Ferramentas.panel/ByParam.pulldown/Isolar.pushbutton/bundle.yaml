title: "Isolar\nTemp."
author: "Thiago Barreto Sobral Nunes"
tooltip: |
  Isola temporariamente na vista ativa todos os elementos do projeto
  com o mesmo valor de parametro do elemento de referencia

  • Selecione um elemento de referencia
  • Escolha o parametro e valor
  • Todos os elementos correspondentes sao isolados (qualquer categoria)
