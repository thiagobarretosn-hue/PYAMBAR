title: "Param\nForge"
author: "Thiago Barreto Sobral Nunes"
tooltip: |
  Ferramenta unificada de analise visual e documentacao por parametros.

  VISUALIZAR:
    - Aplicar cores por valor de parametro
    - Criar filtros de vista com cores
    - Criar legenda (FilledRegion + Tags)

  DOCUMENTAR:
    - Criar schedules filtrados a partir de templates
    - Mapeamento dinamico categoria → template
    - Prefixo customizavel para nomes

  WORKFLOW:
    1. Selecione categorias e parametros
    2. Marque os valores desejados
    3. Use as abas Visualizar ou Documentar
